<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تباشير | كل يوم... وجهٌ أجمل للعالم</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #fdfdfd; --accent: #d4a373; --text: #1a1a1a; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--primary); color: var(--text); margin: 0; line-height: 1.8; }
        header { background: #fff9f0; padding: 60px 20px; text-align: center; border-bottom: 1px solid #eee; }
        .logo { font-family: 'Amiri', serif; font-size: 4rem; color: var(--accent); margin: 0; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; }
        .news-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-right: 5px solid var(--accent); }
        .card h3 { margin: 0 0 10px; color: #2c3e50; }
        .about { background: #faedcd; padding: 40px; border-radius: 20px; margin-top: 50px; text-align: center; font-family: 'Amiri', serif; font-size: 1.3rem; }
    </style>
</head>
<body>
    <header>
        <h1 class="logo">تباشير</h1>
        <p>كل يوم... وجهٌ أجمل للعالم</p>
    </header>
    <div class="container">
        <div class="news-grid" id="news-container">
            <!-- START_NEWS -->
            <p style="text-align:center;">جاري تحضير أولى التباشير... يرجى تشغيل المحرك من تبويب Actions</p>
            <!-- END_NEWS -->
        </div>

        <div class="about">
            <h2>ما هي تباشير؟</h2>
            <p>تباشير هي منصة إنسانية تعمل بالذكاء الاصطناعي للبحث عن الجمال والخير في هذا العالم وتقديمه لك كل ساعة.</p>
        </div>
    </div>
</body>
</html>
